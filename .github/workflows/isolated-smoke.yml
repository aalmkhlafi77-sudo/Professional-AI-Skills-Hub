name: Isolated candidate smoke tests
on:
  push:
    branches: [test/isolated-gsap-sentry-wave-3]
  pull_request:
    paths:
      - 'integration/**'
      - '.github/workflows/isolated-smoke.yml'
permissions:
  contents: read
jobs:
  sentry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download pinned source, verify, run synthetic fixtures
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/thirdparty"
          python3 integration/verify_upstream.py \
            https://raw.githubusercontent.com/getsentry/skills/a582c51ee29d0f35e6ac321340796f77d43da733/skills/skill-scanner/scripts/scan_skill.py \
            14aaa7b059c659ea5c2719fa266f19641dfd9d3d \
            "$RUNNER_TEMP/thirdparty/scan_skill.py"
          python3 -m venv "$RUNNER_TEMP/sentry-env"
          "$RUNNER_TEMP/sentry-env/bin/pip" install --disable-pip-version-check pyyaml==6.0.2
          "$RUNNER_TEMP/sentry-env/bin/python" integration/sentry_smoke.py "$RUNNER_TEMP/thirdparty/scan_skill.py"
  gsap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned runtime packages without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gsap-test"
          cd "$RUNNER_TEMP/gsap-test"
          npm install --no-save --ignore-scripts --no-audit --no-fund gsap@3.14.2 playwright@1.56.1
          cp node_modules/gsap/dist/gsap.min.js .
          cp node_modules/gsap/dist/ScrollTrigger.min.js .
          cat > index.html <<'EOF'
          <!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
          <style>body{margin:0;font:16px Arial;overflow-x:hidden;background:#f3f6f9}.hero{height:100vh;display:grid;place-items:center}.spacer{height:120vh}.card{width:min(70vw,440px);height:240px;background:#214e8a;border-radius:24px;opacity:.3;transform:translateY(120px)}.end{height:100vh}</style></head><body><main><section class="hero"><h1>GSAP scroll motion test</h1></section><section class="spacer"><div class="card" aria-label="animated card"></div></section><section class="end">End</section></main>
          <script src="./gsap.min.js"></script><script src="./ScrollTrigger.min.js"></script><script>gsap.registerPlugin(ScrollTrigger);window.tracker={reduced:matchMedia('(prefers-reduced-motion: reduce)').matches};if(!window.tracker.reduced){window.anim=gsap.to('.card',{y:0,opacity:1,scrollTrigger:{id:'smoke',trigger:'.card',start:'top bottom',end:'center center',scrub:true}});}</script></body></html>
          EOF
          mkdir -p "$GITHUB_WORKSPACE/integration/evidence"
          CHROME_BIN=/usr/bin/google-chrome GSAP_TEST_ROOT="$RUNNER_TEMP/gsap-test" GSAP_EVIDENCE_DIR="$GITHUB_WORKSPACE/integration/evidence" NODE_PATH="$RUNNER_TEMP/gsap-test/node_modules" node "$GITHUB_WORKSPACE/integration/gsap_smoke.js"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gsap-smoke-screenshots
          path: integration/evidence/*.png
          if-no-files-found: ignore
