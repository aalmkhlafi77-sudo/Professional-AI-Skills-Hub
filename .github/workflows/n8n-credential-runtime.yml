name: n8n disposable credential storage test
on:
  pull_request:
    paths:
      - 'integration/n8n-credential-runtime.sh'
      - '.github/workflows/n8n-credential-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Import synthetic credential in network-disabled n8n container
        shell: bash
        run: bash integration/n8n-credential-runtime.sh
